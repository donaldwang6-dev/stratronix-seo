name: CN Mirror Sync - Gitee + Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate .gz
        run: |
          find . -name "*.html" -type f | while read f; do
            gzip -9 -k -f "$f"
          done
          echo "Generated $(find . -name '*.html.gz' | wc -l) .gz files"

      - name: Commit .gz
        run: |
          git config user.name "JERRY-Auto-Bot"
          git config user.email "jerry@stratronix.ai"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动同步 - 重新生成 .gz 预压缩"
          fi

      - name: Sync to Gitee (国内镜像)
        if: env.GITEE_RSA_KEY != ''
        env:
          GITEE_RSA_KEY: ${{ secrets.GITEE_RSA_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GITEE_RSA_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add gitee git@gitee.com:donaldwang6-dev/stratronix-seo.git 2>/dev/null || true
          git push gitee master --force || echo "Gitee push failed, will retry later"

      - name: Trigger Cloudflare Pages Deploy
        if: env.CF_DEPLOY_HOOK != ''
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          echo "Triggering Cloudflare Pages deploy hook..."
          curl -X POST "$CF_DEPLOY_HOOK" || echo "Cloudflare trigger failed"

      - name: Notify success
        if: success()
        run: |
          echo "✅ 国内镜像同步完成"
          echo "📍 Gitee Pages: https://donaldwang6-dev.gitee.io/stratronix-seo/"
          echo "📍 Cloudflare Pages: https://stratronix-seo-cn.pages.dev/"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ 同步失败，请查看 logs"
